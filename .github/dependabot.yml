# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      astro:
        patterns:
          - "@astrojs/*"
          - "astro"
      linter:
        patterns:
          - "prettier"
          - "prettier-plugin-astro"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/vite"
