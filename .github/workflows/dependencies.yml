# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Update dependencies
on:
  pull_request:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
jobs:
  dependabot:
    name: Merge automatic pull requests
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Collect update metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Wait for tests to pass
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          check-regexp: Prove the package
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      - name: Wait for builds to succeed
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          check-regexp: Preview the build
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      - name: Wait for servers to setup
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          check-regexp: Setup servers
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
      - name: Merge requests from the kind dependabot
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  flake:
    name: Bump the latest build dependencies
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: flakes
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Gather credentials
        id: credentials
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Checkout the latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true
          token: ${{ steps.credentials.outputs.token }}
      - name: Update to the latest packages
        id: update
        run: |
          nix flake update
          if git diff --quiet -- flake.lock; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Check the updated runtime
        if: steps.update.outputs.changed == 'true'
        run: |
          nix flake check --no-build
          nix develop --command npm ci
          nix develop --command npm run lint
          nix develop --command npm run build
      - name: Propose the verified lock
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.email "tom@deorr.co"
          git config user.name "@theorderingmachine"
          git add flake.lock
          git commit -m "chore(deps): automatic update to the dependencies of packages"
          git fetch --prune origin
          UPDATE_SHA=""
          if git show-ref --verify --quiet refs/remotes/origin/update; then
            UPDATE_SHA="$(git rev-parse origin/update)"
            if [[ "$(git rev-list --count "origin/main..$UPDATE_SHA")" -gt 1 ]]; then
              printf '%s\n' "Skipping update because unexpected changes exist on the 'update' branch"
              exit 0
            fi
          fi
          git push --force-with-lease="refs/heads/update:$UPDATE_SHA" origin HEAD:refs/heads/update
          PR_COUNT="$(gh pr list --base main --head update --state open --json number --jq length)"
          if [[ "$PR_COUNT" == 0 ]]; then
            gh pr create --base main --head update \
              --title "chore(deps): automatic update to the dependencies of packages" --body ":snowflake:" \
              --label dependencies --assignee theorderingmachine
          fi
          gh pr merge --auto --squash --delete-branch update
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.credentials.outputs.token }}
